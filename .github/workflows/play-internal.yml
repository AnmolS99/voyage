name: Play Internal Testing Build

on:
  workflow_dispatch: {}

concurrency:
  group: play-internal-build
  cancel-in-progress: false

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the shared country fixture is current
        # Guards against world.geojson changing without regenerating the fixture
        # both platforms' parser tests assert.
        working-directory: ${{ github.workspace }}
        run: python3 scripts/generate_country_fixture.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.1 build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests + lint
        # Nothing ships unless these pass.
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Ruby gems
        run: bundle install

      - name: Write upload keystore + keystore.properties
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/voyage-android-upload.keystore"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          {
            echo "storeFile=$KEYSTORE"
            echo "storePassword=$ANDROID_UPLOAD_STORE_PASSWORD"
            echo "keyAlias=voyage-android-upload"
            echo "keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD"
          } > keystore.properties

      - name: Build and upload to Play internal testing
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane internal

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: voyage-release-aab
          # Paths are repo-relative — upload-artifact ignores the job's working-directory.
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload test + lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
            android/fastlane/report.xml
