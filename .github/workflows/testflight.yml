name: TestFlight Build

on:
  workflow_dispatch: {}

concurrency:
  group: testflight-build
  cancel-in-progress: false

defaults:
  run:
    working-directory: ios

jobs:
  build:
    # App Store Connect requires the iOS 27 SDK (Xcode 27) from April 2027
    # (ITMS-90725). GitHub ships Xcode 27 only on its own image, not on
    # macos-15 or macos-26, which top out at Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'

      - name: Check iOS SDK
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $SDK"
          if [ "${SDK%%.*}" -lt 27 ]; then
            echo "::error::Built with the iOS $SDK SDK; App Store Connect requires iOS 27 or later (ITMS-90725)"
            exit 1
          fi

      - name: Install Ruby gems
        run: bundle install

      - name: Write Secrets.xcconfig
        env:
          SECRETS_XCCONFIG: ${{ secrets.SECRETS_XCCONFIG }}
        run: printf '%s\n' "$SECRETS_XCCONFIG" > Secrets.xcconfig

      - name: Compute match git auth
        id: match_auth
        env:
          MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
          MATCH_GIT_PAT: ${{ secrets.MATCH_GIT_PAT }}
        run: |
          AUTH=$(printf '%s' "$MATCH_GIT_USERNAME:$MATCH_GIT_PAT" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          echo "auth=$AUTH" >> "$GITHUB_OUTPUT"

      - name: Build and upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ steps.match_auth.outputs.auth }}
        run: bundle exec fastlane beta

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs
          path: |
            ~/Library/Logs/gym
            ios/fastlane/report.xml
