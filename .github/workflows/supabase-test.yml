name: Supabase Tests

on:
  pull_request:
    paths:
      - 'shared/supabase/**'
      - '.github/workflows/supabase-*.yml'
  push:
    branches: [master]
    paths:
      - 'shared/supabase/**'
      - '.github/workflows/supabase-*.yml'
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.120.0

      - name: Start database with all migrations
        run: supabase db start --workdir shared

      - name: Run pgTAP tests
        run: supabase test db --workdir shared
