name: Supabase Tests

on:
  pull_request:
    paths:
      - 'shared/supabase/**'
      - 'shared/data/world.geojson'
      - 'shared/data/neighbor_links.json'
      - 'shared/data/neighbors.json'
      - 'shared/data/border_distances.json'
      - 'shared/fixtures/daily/**'
      - 'scripts/generate_neighbors.py'
      - '.github/workflows/supabase-*.yml'
  push:
    branches: [master]
    paths:
      - 'shared/supabase/**'
      - 'shared/data/world.geojson'
      - 'shared/data/neighbor_links.json'
      - 'shared/data/neighbors.json'
      - 'shared/data/border_distances.json'
      - 'shared/fixtures/daily/**'
      - 'scripts/generate_neighbors.py'
      - '.github/workflows/supabase-*.yml'
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Any migration on master may already be deployed, and `supabase db push`
      # never re-runs one, so an edit to it would silently never reach production.
      # Change the schema with a new migration instead.
      - name: Check no merged migration was edited
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE"
          changed=$(git diff --name-only --diff-filter=MDR "$BASE" HEAD -- shared/supabase/migrations/)
          if [ -n "$changed" ]; then
            echo "::error::These migrations are on master and must not change; write a new migration instead:"
            echo "$changed"
            exit 1
          fi

      # The graph table is loaded from a generated migration, so a stale one
      # would ship stale borders. Also guards the JSON both apps read.
      - name: Check the country graph is current
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet numpy==2.5.3
          "$RUNNER_TEMP/venv/bin/python" scripts/generate_neighbors.py --check

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.120.0

      - name: Start database with all migrations
        run: supabase db start --workdir shared

      - name: Run pgTAP tests
        run: supabase test db --workdir shared
